  <!-- Wheels -->
  <circle cx="256" cy="416" r="32" fill="#0f2027" stroke="#1de9b6" stroke-width="24"/>
  <circle cx="376" cy="416" r="32" fill="#0f2027" stroke="#1de9b6" stroke-width="24"/>
</svg>
